<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Výdaje">
<meta name="theme-color" content="#0F1115">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Výdaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#0F1115;--card:#181B22;--card2:#1E222B;--line:#262A33;--tx:#F3F4F6;--mut:#9CA3AF;--dim:#6B7280;--inc:#60A5FA;--exp:#FB923C;--cash:#A78BFA;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;height:100%;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Space Grotesk',Inter,sans-serif;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}.mut{color:var(--mut)}
#app{min-height:100%;padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 96px)}
.h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:8px 0 14px}
.card{background:var(--card);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lbl{font-size:12px;color:var(--mut)}
.big{font-size:20px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:12px;padding:3px}
.seg button{min-height:36px;border:none;border-radius:9px;background:transparent;color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{background:#2B303B;color:var(--tx)}
/* calendar */
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--mut);text-align:center;margin:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{height:64px;border-radius:12px;border:1.5px solid #1C2028;background:#14171D;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 0;color:var(--tx);overflow:hidden}
.day.has{background:var(--card2);border-color:#2E3440}
.day.sel{background:#2B303B;border-color:var(--tx)}
.day.blank{background:transparent;border:none}
.day .n{font-size:13px;font-weight:700;line-height:18px;margin-bottom:2px;color:var(--dim)}
.day.has .n,.day.sel .n{color:var(--tx)}
.day.today .n{background:var(--tx);color:var(--bg);border-radius:9px;min-width:18px;padding:0 4px}
.day .a{font-size:10.5px;font-weight:600;line-height:1.15;min-height:12px;white-space:nowrap}
.day .plan{opacity:.5}
.an-l{animation:anL .22s ease-out}.an-r{animation:anR .22s ease-out}@keyframes anL{from{transform:translateX(40px);opacity:.2}}@keyframes anR{from{transform:translateX(-40px);opacity:.2}}
.lc{position:relative;touch-action:pan-y;cursor:crosshair}.lc .vl{position:absolute;top:0;bottom:0;width:1px;background:#4B5563;pointer-events:none}.lc .dot{position:absolute;width:10px;height:10px;border-radius:5px;background:var(--inc);border:2px solid var(--bg);transform:translate(-50%,-50%);pointer-events:none}.lc .tip{position:absolute;top:-4px;transform:translate(-50%,-100%);background:#2B303B;border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.4);text-align:center}
.sheet{margin:14px -16px 0;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px 76px;min-height:200px}
.tx{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;background:none;border:none;text-align:left}
.tx .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:15px}
.tx .ic.e{background:#2A2018;color:var(--exp)}.tx .ic.i{background:#172235;color:var(--inc)}
.tx .t1{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-size:14px;font-weight:600;white-space:nowrap}
.tx.plan{opacity:.55}
.fab{position:fixed;right:20px;bottom:calc(var(--sb) + 92px);width:60px;height:60px;border-radius:30px;background:var(--tx);color:var(--bg);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#14171D;border-top:1px solid #22262E;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 0 calc(var(--sb) + 6px);z-index:6}
.tabs button{background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-height:48px}
.tabs button.on{color:var(--tx);font-weight:600}
/* bars */
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:16px}.slide .bars{height:190px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;background:none;border:none;padding:0}
.bars .pair{display:flex;align-items:flex-end;gap:2px;flex:1;width:100%;justify-content:center}
.bars .pair div{width:40%;max-width:10px;border-radius:3px 3px 0 0;min-height:1px}
.bars .l{font-size:10px;color:var(--mut)}
.bars .b.dim .pair{opacity:.35}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.slides::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;padding:0 16px;box-sizing:border-box}.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}.dots span{width:6px;height:6px;border-radius:3px;background:#3A3F4B;transition:width .2s}.dots span.on{width:16px;background:var(--tx)}
.catbar{height:6px;border-radius:3px;background:#1F232B;margin-top:6px}
.catbar div{height:6px;border-radius:3px;background:var(--exp)}
/* accounts */
.acc{width:100%;border:1.5px solid transparent;background:var(--card);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left}
.acc.main{border-color:var(--tx);background:var(--card2)}
.acc .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex:none}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:14px;gap:2px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.modal{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(var(--sb) + 18px);border-top:1px solid var(--line)}
.amount{width:100%;background:none;border:none;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:600;outline:none;padding:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.chip.on{border-color:currentColor;background:#1F242D}
.chip.add{border-style:dashed;border-color:#4B5563;background:transparent;color:#D1D5DB}
.form{background:var(--card);border-radius:16px;margin-top:14px}
.form label{display:flex;justify-content:space-between;align-items:center;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.form label:last-child{border-bottom:none}
.form input,.form select{background:transparent;border:none;text-align:right;font-size:15px;outline:none;min-width:0;flex:1;color:var(--tx)}
.form input[type=date]{text-align:right;-webkit-appearance:none}
.form select{-webkit-appearance:none;direction:rtl}
.btn{width:100%;min-height:54px;border-radius:16px;border:none;background:var(--tx);color:var(--bg);font-weight:600;font-size:16px;margin-top:14px}
.btn.sec{background:var(--card);color:var(--tx);font-weight:500}
.btn.danger{background:transparent;color:#F87171;border:1px solid #3A2A2A}
.small{font-size:13px}
.list-h{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 170px);background:#2B303B;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4)}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--tx);font-size:13px}
.empty{color:var(--mut);font-size:14px;padding:16px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<script>
(function(){
'use strict';
var KEY='vydaje.v1';
var DEF_EXP=['Jídlo','Jídlo venku','Bydlení','Doprava','Benzín','Technika','Zábava','Předplatné','Oblečení','Zdraví','Ostatní'];
var DEF_INC=['Výplata','Zakázka','Prodej','Dárek','Ostatní'];
var DB_CAT={'Eating out':'Jídlo venku','Groceries':'Jídlo','Car & Transportation':'Doprava','Entertainment':'Zábava','Personal care':'Péče','Benzin':'Benzín','Clothing':'Oblečení','Health':'Zdraví','Fitness':'Fitness','Subscriptions':'Předplatné','Household':'Domácnost','Income':'Příjem','Uncategorized':'Ostatní'};
var ADJ='Úprava zůstatku';
var MON=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
var MON2=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
var WD=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];

function blank(){return {v:2,accounts:[{id:'czk',name:'CZK účet',cur:'CZK',main:true},{id:'eur',name:'EUR účet',cur:'EUR'},{id:'cash',name:'Hotovost',cur:'CZK'}],tx:[],cats:{exp:DEF_EXP.slice(),inc:DEF_INC.slice()},rate:25,rateAt:null};}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
if(S.v<2){S.tx.forEach(function(t){if(t.src&&t.pl)delete t.pl;});S.v=2;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Uložení selhalo: '+e.message);}if(typeof schedSync==='function')schedSync();}

var now=new Date();
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return (n<10?'0':'')+n;}
var TODAY=iso(now);
var V={tab:'cal',y:now.getFullYear(),m:now.getMonth(),sel:TODAY,pv:'m',py:now.getFullYear(),pm:now.getMonth(),acc:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function acc(id){for(var i=0;i<S.accounts.length;i++)if(S.accounts[i].id===id)return S.accounts[i];return S.accounts[0];}
function mainId(){for(var i=0;i<S.accounts.length;i++)if(S.accounts[i].main)return S.accounts[i].id;return S.accounts[0].id;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var nf=new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:2});
var nf0=new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:0});
function money(v,cur,sign,r){var s=(r?nf0:nf).format(Math.abs(v));var pre=sign?(v<0?'− ':v>0?'+ ':''):(v<0?'− ':'');return pre+s+' '+(cur==='EUR'?'€':'Kč');}
function short(v){var a=Math.abs(v),s;if(a<1000)s=nf0.format(Math.round(a));else if(a<10000)s=(Math.round(a/100)/10).toString().replace('.',',')+'k';else s=Math.round(a/1000)+'k';return (v<0?'−':'+')+s;}
function isAdj(t){return t.cat===ADJ;}
function fmtDay(d){var x=new Date(d+'T12:00:00');return WD[x.getDay()]+' '+x.getDate()+'. '+MON2[x.getMonth()];}

/* aggregates over main account */
function byDay(ym,accId){var r={};S.tx.forEach(function(t){if(t.acc!==accId||isAdj(t)||t.d.slice(0,7)!==ym)return;var o=r[t.d]||(r[t.d]={i:0,e:0,pi:0,pe:0});if(t.pl){if(t.a>0)o.pi+=t.a;else o.pe+=t.a;}else if(t.a>0)o.i+=t.a;else o.e+=t.a;});return r;}
function sumRange(from,to,accId){var i=0,e=0,c={};S.tx.forEach(function(t){if(t.acc!==accId||isAdj(t)||t.pl||t.d<from||t.d>to)return;if(t.a>0)i+=t.a;else{e+=t.a;c[t.cat]=(c[t.cat]||0)+t.a;}});return {i:i,e:e,c:c};}
function balance(accId,upto){var b=0;S.tx.forEach(function(t){if(t.acc===accId&&!t.pl&&t.d<=(upto||TODAY))b+=t.a;});return b;}
function toCZK(v,a){return a.cur==='EUR'?v*(S.rate||25):v;}

function toast(m){var el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(function(){el.remove();},2400);}

var ICON={
 left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
 right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
 plus:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 wallet:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 13h2M2 10h20"/></svg>',
 gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 cash:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>'
};
function accIcon(a){if(a.main)return '<div class="ic" style="background:#F3F4F6;color:#0F1115">Kč</div>';if(a.cur==='EUR')return '<div class="ic" style="background:#172235;color:#60A5FA;font-size:18px">€</div>';if(a.id==='cash')return '<div class="ic" style="background:#231C33;color:#A78BFA">'+ICON.cash+'</div>';return '<div class="ic" style="background:#1F2937;color:#D1D5DB">'+esc(a.name.slice(0,2))+'</div>';}
function accColor(a,i){return a.main?'#F3F4F6':a.cur==='EUR'?'#60A5FA':a.id==='cash'?'#A78BFA':['#34D399','#F472B6','#FBBF24'][i%3];}

function txRow(t,showDate){var a=acc(t.acc);var plan=t.d>TODAY||t.pl;var inc=t.a>0;
 var sub=[showDate?fmtDay(t.d):null,t.cat!==t.note&&t.note?t.cat:null,t.pl?'nepotvrzeno':t.d>TODAY?'naplánováno':null,!a.main&&!showDate?a.name:null].filter(Boolean).join(' · ');
 return '<button class="tx'+(plan?' plan':'')+'" data-edit="'+t.id+'"><div class="ic '+(inc?'i':'e')+'">'+(inc?'+':'−')+'</div><div style="flex:1;min-width:0"><div class="t1">'+esc(t.note||t.cat)+'</div><div class="t2">'+esc(sub||t.cat)+'</div></div><div class="amt '+(inc?'inc':'')+'">'+money(t.a,a.cur,true)+'</div></button>';}

/* ---------- views ---------- */
function vCal(){
 var bn=needBackup()?'<div id="bkBanner" class="card between" style="margin-bottom:12px;padding:10px 14px;border:1px solid #4B3A1F;background:#211B12"><span class="small">Poslední záloha: '+ago(lastBackupAt())+'</span><button class="chip" style="min-height:36px;border-color:var(--exp);color:var(--exp)" data-act="'+(SY.gist?'syncNow':'expJSON')+'">Zálohovat</button></div>':'';
 var y=V.y,m=V.m,ym=y+'-'+p2(m+1),mid=mainId(),days=byDay(ym,mid);
 var last=new Date(y,m+1,0).getDate(),tot=sumRange(ym+'-01',ym+'-31',mid);
 var first=(new Date(y,m,1).getDay()+6)%7;
 var h=bn+'<div class="between" style="margin-top:4px"><button class="iconbtn" data-act="prevM" aria-label="Předchozí měsíc">'+ICON.left+'</button><button style="background:none;border:none;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none" data-act="todayM" aria-label="Podrž pro výběr měsíce"><div class="num" style="font-size:22px;font-weight:600">'+MON[m]+' '+y+'</div><div class="small mut row" style="margin-top:3px;gap:8px;justify-content:center"><span class="num" style="font-weight:600;color:'+(tot.i+tot.e>=0?'var(--inc)':'var(--exp)')+'">'+money(tot.i+tot.e,'CZK',true,1)+'</span><span style="color:#3A3F4B">|</span><span class="row num" style="gap:4px;font-weight:600;color:var(--tx)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 13h2M2 10h20"/></svg>'+money(balance(mid,ym+'-31'<TODAY?ym+'-31':TODAY),'CZK',0,1)+'</span></div></button><button class="iconbtn" data-act="nextM" aria-label="Další měsíc">'+ICON.right+'</button></div>';
 h+='<div class="grid2" style="margin-top:14px"><div class="card" style="padding:12px 14px"><div class="lbl">Příjmy</div><div class="num big inc">'+money(tot.i,'CZK',0,1)+'</div></div><div class="card" style="padding:12px 14px"><div class="lbl">Výdaje</div><div class="num big exp">'+money(-tot.e,'CZK',0,1)+'</div></div></div>';
 h+='<div id="calSw" style="touch-action:pan-y"><div class="wd"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="cal'+(V.anim?' an-'+V.anim:'')+'">';V.anim=null;
 for(var b=0;b<first;b++)h+='<div class="day blank"></div>';
 for(var d=1;d<=last;d++){var ds=ym+'-'+p2(d),o=days[ds],cls='day'+(o?' has':'')+(ds===V.sel?' sel':'')+(ds===TODAY?' today':''),fut=ds>TODAY;
  var ci=o?o.i:0,ce=o?o.e:0,pi=o?o.pi:0,pe=o?o.pe:0,ia=ci||pi,ea=ce||pe,ip=(fut||!ci)&&ia?' plan':'',ep=(fut||!ce)&&ea?' plan':'';
  h+='<button class="'+cls+'" data-day="'+ds+'" aria-label="'+d+'. '+MON2[m]+'"><span class="n">'+d+'</span><span class="a inc'+ip+'">'+(ia?short(ci+pi):'')+'</span><span class="a exp'+ep+'">'+(ea?short(ce+pe):'')+'</span></button>';}
 h+='</div></div>';
 var list=S.tx.filter(function(t){return t.d===V.sel&&t.acc===mid&&!isAdj(t);}),si=0,se=0;list.forEach(function(t){if(t.pl)return;if(t.a>0)si+=t.a;else se+=t.a;});

  case 'impDB':document.getElementById('fDB').click();break;
  case 'impJSON':document.getElementById('fJSON').click();break;
  case 'expJSON':S.lastExport=new Date().toISOString();save();download('vydaje-zaloha-'+TODAY+'.json',JSON.stringify(S),'application/json');refreshSyncUI();break;
  case 'syncOn':var tk=(document.getElementById('ghTok').value||'').trim();if(!tk){toast('Vlož token');break;}connectSync(tk);break;
  case 'syncNow':if(!SY.gist){download('vydaje-zaloha-'+TODAY+'.json',JSON.stringify(S),'application/json');break;}toast('Zálohuji…');pushSync(true).then(function(){if(!SY.err)toast('Zálohováno');else toast('Chyba: '+SY.err);});break;
  case 'syncRestore':restoreSync(false);break;
  case 'syncOff':if(confirm('Odpojit cloud? Záloha na GitHubu zůstane.')){SY={};saveSY();render();}break;
  case 'expCSV':exportCSV();break;
  case 'bulk':var q=(document.getElementById('bkTxt').value||'').trim().toLowerCase(),tc=document.getElementById('bkCat').value;if(!q){toast('Zadej text');break;}var hits=S.tx.filter(function(t){return t.cat==='Ostatní'&&(t.note||'').toLowerCase().indexOf(q)>=0;});if(!hits.length){toast('Nic nenalezeno');break;}if(confirm('Přesunout '+hits.length+' záznamů do „'+tc+'“?')){hits.forEach(function(t){t.cat=tc;});save();toast('Přesunuto '+hits.length);}break;
  case 'wipe':if(confirm('Opravdu smazat všechna data? Nejdřív si udělej zálohu.')&&confirm('Fakt? Nejde to vrátit.')){S=blank();save();render();toast('Smazáno');}break;
 }
});
var pressT=null;
document.addEventListener('touchstart',function(ev){var el=ev.target.closest('[data-delcat]');if(!el)return;pressT=setTimeout(function(){var p=el.dataset.delcat.split('|'),b=p[0],c=p.slice(1).join('|');if(confirm('Odebrat kategorii „'+c+'“? Záznamy zůstanou.')){S.cats[b]=S.cats[b].filter(function(x){return x!==c;});save();render();}},600);},{passive:true});
document.addEventListener('touchend',function(){clearTimeout(pressT);});
document.addEventListener('contextmenu',function(ev){var el=ev.target.closest('[data-delcat]');if(!el)return;ev.preventDefault();var p=el.dataset.delcat.split('|'),b=p[0],c=p.slice(1).join('|');if(confirm('Odebrat kategorii „'+c+'“? Záznamy zůstanou.')){S.cats[b]=S.cats[b].filter(function(x){return x!==c;});save();render();}});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='fDB'&&t.files[0]){var accId=document.getElementById('impAcc').value;t.files[0].text().then(function(txt){try{var r=importDB(txt,accId);toast('Přidáno '+r.added+(r.upd?', opraveno '+r.upd:'')+', beze změny '+r.skip);render();}catch(e){alert(e.message);}});t.value='';}
 if(t.id==='fJSON'&&t.files[0]){t.files[0].text().then(function(txt){try{var o=JSON.parse(txt);if(!o||!o.tx||!o.accounts)throw new Error('Neplatná záloha');if(confirm('Nahradit současná data zálohou ('+o.tx.length+' záznamů)?')){S=o;save();render();toast('Obnoveno');}}catch(e){alert(e.message);}});t.value='';}
 if(t.id==='eAcc'){readEditor();drawEditor();}
 if(t.id==='cFrom'||t.id==='cTo'){if(t.value){if(t.id==='cFrom')V.cf=t.value;else V.ct=t.value;V.catf=null;render();}}
});

/* ---------- EUR rate (ECB via frankfurter) ---------- */
function fetchRate(force){if(S.rateManual&&!force)return;if(!force&&S.rateChecked===TODAY)return;
 var done=function(v,d){S.rate=Math.round(v*1000)/1000;S.rateAt=d||TODAY;S.rateChecked=TODAY;S.rateManual=false;save();if(V.tab==='acc')render();if(force)toast('Kurz '+nf.format(S.rate)+' Kč');};
 var j=function(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();});};
 j('https://api.frankfurter.app/latest?from=EUR&to=CZK').then(function(o){if(!(o&&o.rates&&o.rates.CZK))throw 0;done(o.rates.CZK,o.date);})
 .catch(function(){return j('https://open.er-api.com/v6/latest/EUR').then(function(o){if(!(o&&o.rates&&o.rates.CZK))throw 0;done(o.rates.CZK,(o.time_last_update_utc?iso(new Date(o.time_last_update_utc)):TODAY));});})
 .catch(function(){if(force)toast('Kurz se nepodařilo stáhnout');});}

/* ---------- URL params (Apple Pay shortcut) ---------- */
function handleURL(){var q=new URLSearchParams(location.search);if(!q.has('add'))return;
 var v=parseAmt(q.get('add')),note=(q.get('note')||'').trim(),type=q.get('type')==='inc'?'inc':'exp',accId=q.get('acc')||mainId(),cat=q.get('cat');
 history.replaceState(null,'',location.pathname);
 if(!(v>0)){openEditor({note:note,type:type,acc:accId,d:TODAY});return;}
 if(q.get('auto')==='1'){S.tx.push({id:uid(),d:TODAY,a:type==='inc'?v:-v,cat:cat||'Ostatní',note:note,acc:accId,grp:null});save();V.sel=TODAY;render();toast('Přidáno: '+money(type==='inc'?v:-v,acc(accId).cur,true));return;}
 openEditor({amt:String(v).replace('.',','),note:note,type:type,acc:accId,cat:cat,d:TODAY});}

render();handleURL();fetchRate();
document.addEventListener('visibilitychange',function(){if(!document.hidden)fetchRate();});
})();
</script>
